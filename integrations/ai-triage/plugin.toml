# Пульт к своим ИИ-хозяйствам: остатки по моделям, разбор сессий Клода и бот в
# телеге с его логами.
#
# Три входа, у каждого своя роль:
#   service — считает состояние и гоняет обход. Один на всю сессию.
#   widget  — иконка в баре. Живёт на каждом мониторе, поэтому сам ничего
#             не считает: только показывает то, что положила служба.
#   panel — пять вкладок: лимиты, архив, бот, логи, память.
#
# Хозяйство лежит в /home/q/storage/ai и /home/q/dev/chat-bot; вся работа
# делается их же скриптами (bin/memory_cli.py, bin/triage.py, tools/status.py,
# tools/runs.py), плагин ничего не дублирует. Правило не косметическое: копия
# логики на Lua, который правят раз в месяц, разъедется с оригиналом молча, и
# заметят это по неверным числам в баре, а не по ошибке.
#
# Остатки по провайдерам считает `omp usage --json` — та же причина: окна,
# доли и тарифы уже посчитаны им, второй счёт на Lua разошёлся бы с первым.

id = "q/ai-triage"
name = "AI"
version = "3.0.1"
# 32 — текущий API хоста. Нужен не только ради require соседнего файла (22):
# общий модуль читает семейство и материал скина через getSetting (26) и
# getColor (31). Ниже 31 модуль не увидел бы активную палитру и вернул бы
# пустые цвета, поэтому здесь честный минимум, а не прежние 22.
plugin_api = 32
author = "q"
license = "MIT"
dependencies = []
tags = ["productivity"]
icon = "robot"
description = "Лимиты моделей, архив поиска, бот, логи и автономная доставка памяти v2."

[[widget]]
# Идентификатор входа виджета — это ещё и имя типа, которым он зовётся в
# баре (`end = [ ..., "q/ai-triage:ai-triage-widget", ... ]`). Менять его
# нельзя, даже когда плагин перерос своё имя: строка лежит в
# `~/.local/state/noctalia/settings.toml`, и переименование выкинет виджет
# из бара молча.
id = "ai-triage-widget"
entry = "widget.luau"

# Explicit attachment: the cassette opens from this independent bar entry.
#
# `capture_keys` — вим-биндами по вкладкам ходят с клавиатуры, и пока панель
# открыта, эти клавиши не доходят больше никуда. Текстового поля здесь нет, так
# что терять нечего; список узкий намеренно — captured-клавиша, которую панель
# не обрабатывает, выглядит как зависшая клавиатура.
#
#   h l   вкладка влево/вправо      1..5   прямо к вкладке
#   j k   вниз/вверх по списку      g      к началу, с начала — в конец
#   Enter развернуть или открыть    Esc    свернуть, потом закрыть
#   r     пересчитать               o      открыть целиком в терминале
#   s x   пуск/стоп бота (вкладка «Бот»)
#   m u   поднять/выгрузить модель (там же)
#   y n   ручной вердикт только во вкладке архива
#   f d   фильтр памяти / обсуждение вопроса в OMP
#   Page_Up Page_Down   страницы доставки памяти
#
# **Русская раскладка ловится наравне с английской** — заказ хозяина
# 06.09.2026, и без неё вим-клавиши работали бы через раз: раскладку под панель
# не переключают, её открывают посреди работы.
#
# Хост зовёт клавиши ИМЕНАМИ КЕЙСИМОВ (`xkb_keysym_get_name`), а не позициями,
# и это решает всё: на русской раскладке та же физическая клавиша `h` даёт не
# «H», а `Cyrillic_er`. Поэтому здесь перечислены обе раскладки, а сводит их
# обратно в одну букву `LAYOUT` в `panel.luau`. Имена сняты `xkbcli how-to-type
# --layout ru`, а не выписаны по памяти: `щ` это `Cyrillic_shcha`, и угадать
# это нельзя.
#
# Оба регистра: без шифта приходит `Cyrillic_er`, с шифтом `Cyrillic_ER`, и это
# разные кейсимы. У латиницы то же самое сглаживает сам хост, отдавая букву
# одиночным аккордом в верхнем регистре.
[[panel]]
id = "triage"
entry = "panel.luau"
width = 900
height = 732
decoration = false
placement = "attached"
open_near_click = true
capture_keys = [
  "Left", "Right", "Up", "Down", "Return", "Escape", "Page_Up", "Page_Down",
  "D", "F", "G", "H", "J", "K", "L", "M", "N", "O", "R", "S", "U", "X", "Y",
  "1", "2", "3", "4", "5",
  "Cyrillic_a", "Cyrillic_A", "Cyrillic_ve", "Cyrillic_VE",
  # h j k l g m n o r s u x y — те же клавиши на ЙЦУКЕН
  "Cyrillic_er", "Cyrillic_o", "Cyrillic_el", "Cyrillic_de", "Cyrillic_pe",
  "Cyrillic_te", "Cyrillic_shcha", "Cyrillic_ka", "Cyrillic_yeru",
  "Cyrillic_che", "Cyrillic_en", "Cyrillic_softsign", "Cyrillic_ghe",
  "Cyrillic_ER", "Cyrillic_O", "Cyrillic_EL", "Cyrillic_DE", "Cyrillic_PE",
  "Cyrillic_TE", "Cyrillic_SHCHA", "Cyrillic_KA", "Cyrillic_YERU",
  "Cyrillic_CHE", "Cyrillic_EN", "Cyrillic_SOFTSIGN", "Cyrillic_GHE",
]

[[service]]
id = "watch"
entry = "service.luau"
